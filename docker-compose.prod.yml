name: gsd-command-center

# Pull-only stack for the Pi: web + socket run the prebuilt GHCR image (built by
# .github/workflows/build-image.yml), so the Pi never compiles.
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# Set IMAGE in .env, e.g.  IMAGE=ghcr.io/youruser/yourrepo:latest

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: ${IMAGE}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      # Runtime copy for parity; the client bundle already has this baked in at
      # CI build time (must match the repo variable used by the workflow).
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
      GSD_ALLOWED_ORIGIN: ${GSD_ALLOWED_ORIGIN}
      GSD_INBOX_ADDRESS: ${GSD_INBOX_ADDRESS}
      STORAGE_DIR: /app/storage/uploads
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Manila}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - uploads:/app/storage/uploads
    command: sh -c "npx prisma migrate deploy && npm run start"

  socket:
    image: ${IMAGE}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      SOCKET_PORT: "3001"
    command: npm run socket

  reminders:
    image: ${IMAGE}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    command: npm run reminders

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - web
      - socket
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}

volumes:
  db-data:
  uploads:
