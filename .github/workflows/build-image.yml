name: Build & push ARM64 image

# Builds the Pi's arm64 image in CI and pushes it to GitHub Container Registry
# (GHCR), so the 4GB Pi only ever pulls — it never compiles.

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - "n8n/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # Faster option: if your plan has arm64 hosted runners, set
    #   runs-on: ubuntu-24.04-arm
    # and delete the "Set up QEMU" step below (native arm64 needs no emulation).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase image path; owner/repo may contain capitals.
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          # NEXT_PUBLIC_* is inlined at build time — set this as a repo VARIABLE
          # (Settings → Secrets and variables → Actions → Variables).
          build-args: |
            NEXT_PUBLIC_SOCKET_URL=${{ vars.NEXT_PUBLIC_SOCKET_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
